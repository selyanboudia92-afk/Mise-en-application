{% extends "base.html" %}
{% block titre %}{{ 'Modifier' if livre['id'] else 'Ajouter' }} un livre{% endblock %}
{% block contenu %}
    <h1>{{ 'Modifier le livre n°' ~ livre['id'] if livre['id'] else 'Ajouter un livre' }}</h1>
    {% if erreur %}<p class="erreur">{{ erreur }}</p>{% endif %}
    <form method="post">
        <label>Titre * :</label> <input type="text" name="titre" value="{{ livre['titre'] or '' }}" required><br><br>
        <label>Auteur * :</label> <input type="text" name="auteur" value="{{ livre['auteur'] or '' }}" required><br><br>
        <label>ISBN :</label> <input type="text" name="isbn" value="{{ livre['isbn'] or '' }}"><br><br>
        <label>Année :</label> <input type="number" name="annee" value="{{ livre['annee'] or '' }}"><br><br>
        <label>Genre :</label> <input type="text" name="genre" value="{{ livre['genre'] or '' }}"><br><br>
        <label>Nombre d'exemplaires * :</label> <input type="number" name="nb_exemplaires" min="0" value="{{ livre['nb_exemplaires'] if livre['nb_exemplaires'] is not none else 1 }}" required><br><br>
        <button type="submit">Enregistrer</button>
    </form>
    <p><a href="/livres">Annuler</a></p>
{% endblock %}
