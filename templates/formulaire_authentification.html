{% extends "base.html" %}
{% block titre %}Authentification{% endblock %}
{% block contenu %}
    <h2>Authentification</h2>
    {% if error %}
        <p class="erreur">Identifiant ou mot de passe incorrect.</p>
    {% endif %}
    <form action="{{ url_for('authentification') }}" method="post">
        <label for="username">Nom d'utilisateur :</label>
        <input type="text" id="username" name="username" required autofocus><br><br>
        <label for="password">Mot de passe :</label>
        <input type="password" id="password" name="password" required><br><br>
        <button type="submit">Se connecter</button>
    </form>
{% endblock %}
