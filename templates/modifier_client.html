{% extends "base.html" %}
{% block titre %}Modifier un client{% endblock %}
{% block contenu %}
    <h1>Modifier le client n°{{ client['id'] }}</h1>
    <form method="post">
        <label>Nom :</label> <input type="text" name="nom" value="{{ client['nom'] }}" required><br><br>
        <label>Prénom :</label> <input type="text" name="prenom" value="{{ client['prenom'] }}" required><br><br>
        <label>Adresse :</label> <input type="text" name="adresse" value="{{ client['adresse'] }}" required><br><br>
        <label>Téléphone :</label> <input type="tel" name="telephone" value="{{ client['telephone'] or '' }}"><br><br>
        <button type="submit">Enregistrer les modifications</button>
    </form>
    <p><a href="/consultation/">Annuler</a></p>
{% endblock %}
